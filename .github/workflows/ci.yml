name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      # tests that need LLVM and CMake fail here instead of being skipped
      CARMA_REQUIRE_LIBCLANG: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      # The same LLVM on every OS, so canonical IDs can be compared across OSes.
      # The action sets LLVM_PATH, which the libclang discovery checks first.
      - uses: KyleMayes/install-llvm-action@v2
        with:
          version: "21.1.8"

      - name: Install dependencies
        run: uv sync --locked

      - name: Tests
        run: uv run pytest -v

  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4

      # Node 24 ships npm 11, which wrote package-lock.json.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: API types match contracts/openapi.yaml
        run: npm run gen:api && git diff --exit-code src/api/schema.ts

      - name: Tests
        run: npm test

      - name: Type check and build
        run: npm run build
