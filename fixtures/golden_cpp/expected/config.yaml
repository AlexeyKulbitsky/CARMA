schema_version: config/0.1
compile_db:
  cmake_build_dir: build
  configuration: Debug
indexer:
  name: libclang
  libclang: null
  index_ignored_tus: false
source_roots: [src, apps]
ignore:
  - "**/third_party/**"
  - "**/thirdparty/**"
  - "**/external/**"
  - "build/**"
  - "out/**"
skeleton_depth: 2
max_nodes: 300
editor_uri: "vscode://file/{abs_path}:{line}"
