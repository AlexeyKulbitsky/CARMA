[project]
name = "carma"
version = "0.0.1"
description = "CARMA: an architecture map of a C++ codebase, built from indexed facts and an editable model"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "clang>=21",
    "fastapi>=0.115",
    "jsonschema>=4.23",
    "ruamel.yaml>=0.18",
    "uvicorn>=0.30",
    "watchfiles>=1.0",
]

[project.scripts]
carma = "carma.cli:main"

[dependency-groups]
dev = [
    "httpx2>=2.13",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["carma"]
# The map built by `npm run build` in ui/: ignored by git, shipped in the wheel when present.
artifacts = ["carma/_ui/**"]

# Contract files live in contracts/ at the repo root; installed builds carry a copy.
[tool.hatch.build.targets.wheel.force-include]
"contracts" = "carma/_contracts"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "e2e: end-to-end runs of the CLI; some need CMake, LLVM and a C++ compiler",
]
